<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Poplur — Splash</title>
  <!-- The splash covers the welcome's booting: warm every heavy asset the
       welcome and sign-up need so they appear instantly composed. -->
  <link rel="preload" as="fetch" href="/poplur-clay-map/public/poplur_icon_cube.glb">
  <link rel="preload" as="fetch" href="/.claude/artifacts/models/poplur-globe-lite.glb">
  <link rel="preload" as="fetch" href="/Poplur2025-iOS/Poplur2025/MarkHead_TalkingRig.glb">
  <link rel="preload" as="fetch" href="/poplur-clay-map/public/zoom_buildings.glb">
  <link rel="preload" as="audio" href="/poplur-clay-map/public/radio_bed.wav">
  <link rel="preload" as="audio" href="/Poplur2025-iOS/Poplur2025/pop.mp3">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #0a0709; }
    body { position: relative; display: grid; place-items: center; font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, sans-serif; }
    video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; z-index: 1; }
    .fallback { position: absolute; width: 45%; max-width: 170px; filter: drop-shadow(0 15px 18px rgba(255,45,145,.3)); z-index: 0; }
    .splash-scrim {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: radial-gradient(circle at 50% 56%, rgba(0,0,0,.55), rgba(0,0,0,.2) 52%, transparent 74%);
    }
    .loader-layer { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
    .loader {
      position: absolute;
      left: 50%;
      top: 68%;
      transform: translate(-50%, -50%);
      width: 58%;
      max-width: 215px;
      display: grid;
      gap: 16px;
      text-align: center;
    }
    .loading-text {
      min-height: 23px;
      margin: 0;
      color: #f43b99;
      font-size: 20px;
      line-height: 1.3;
      font-weight: 850;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      background: linear-gradient(100deg, #ff8ac5 0%, #f43b99 34%, #fff3fa 50%, #f43b99 66%, #c92e7d 100%);
      background-size: 220% 100%;
      background-position: 100% 0;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 12px rgba(244,59,153,.5));
      animation: shaderSweep 2.2s linear infinite;
      transition: opacity .22s ease;
    }
    .loading-text.swap { opacity: .18; }
    .track {
      position: relative;
      width: 100%;
      height: 9px;
      overflow: hidden;
      border: 1px solid rgba(244,59,153,.35);
      border-radius: 999px;
      background: rgba(28,8,18,.55);
      box-shadow: inset 0 2px 4px rgba(0,0,0,.5);
    }
    .fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: 0;
      border-radius: inherit;
      background-image: repeating-linear-gradient(45deg, #ffe1f1 0 15px, #ff86c4 15px 29px, #f53c99 29px 44px);
      background-size: 62px 62px;
      box-shadow: inset 0 2px 2px rgba(255,255,255,.6), inset 0 -2px 4px rgba(140,18,74,.5), 0 0 16px rgba(244,59,153,.32);
      animation: splashFill 4s ease-out infinite, barber .7s linear infinite;
    }
    @keyframes shaderSweep { to { background-position: -120% 0; } }
    @keyframes splashFill { 0% { width: 4%; } 70% { width: 90%; } 88%, 100% { width: 100%; } }
    @keyframes barber { from { background-position: 0 0; } to { background-position: -62px 0; } }
    @media (prefers-reduced-motion: reduce) {
      .loading-text { animation: none; }
      .fill { animation: none; width: 70%; }
    }
  </style>
</head>
<body>
  <img class="fallback" src="/Poplur2025-iOS/Poplur2025/Assets.xcassets/logo.imageset/logo1.png" alt="Poplur">
  <video autoplay muted loop playsinline aria-label="Poplur clay splash animation">
    <source src="/Poplur2025-iOS/Poplur2025/poplur_splash.mp4" type="video/mp4">
  </video>
  <audio id="popSfx" preload="auto" src="/Poplur2025-iOS/Poplur2025/pop.mp3"></audio>
  <audio id="radioBed" loop preload="auto" src="/poplur-clay-map/public/radio_bed.wav"></audio>
  <div class="splash-scrim"></div>
  <div class="loader-layer" aria-label="Splash loading progress">
    <div class="loader">
      <p class="loading-text" aria-live="polite">Warming up the pinetrees</p>
      <div class="track" role="progressbar" aria-label="Loading Poplur" aria-valuemin="0" aria-valuemax="100" aria-valuenow="90">
        <div class="fill"></div>
      </div>
    </div>
  </div>
  <script>
    const messages = [
      "Warming up the pinetrees",
      "Rolling out the clay roads",
      "Teaching the pin to drop",
      "Sprinkling pink stars",
      "Kneading the little mountains",
      "Waking up the tugboat",
      "Polishing the big P",
      "Fluffing the clouds"
    ];
    const video = document.querySelector("video");
    const message = document.querySelector(".loading-text");
    const popSfx = document.getElementById("popSfx");
    const radioBed = document.getElementById("radioBed");
    let messageIndex = 0;
    let audioOn = false;

    // Mark the splash as seen so the welcome renders settled instead of
    // replaying its intro choreography in front of the user.
    try { sessionStorage.setItem("poplurSplashShown", "1"); } catch {}

    // The radio starts here and hands its position to the next screen so the
    // bed never restarts across pages.
    function resumeRadio() {
      try { radioBed.currentTime = parseFloat(sessionStorage.getItem("poplurRadio.t") || "0") || 0; } catch {}
      radioBed.muted = false;
      if (radioBed.volume === 1) radioBed.volume = 0.55;
      radioBed.play().catch(() => {});
    }
    setInterval(() => {
      if (!radioBed.paused) try { sessionStorage.setItem("poplurRadio.t", String(radioBed.currentTime)); } catch {}
    }, 500);

    // Audio can only start after a user gesture; the GCL preview grants it by
    // posting gcAudio on hover, a real device by the first touch.
    function setAudio(on) {
      audioOn = on;
      if (on) resumeRadio();
      else { popSfx.pause(); radioBed.pause(); }
    }
    // Attempt ambient autoplay — succeeds inside the prototype's frame,
    // silently blocked elsewhere until a gesture or GCL grant.
    setTimeout(() => {
      if (!audioOn) radioBed.play().then(() => setAudio(true)).catch(() => {});
    }, 300);
    window.addEventListener("message", event => {
      const data = event && event.data;
      if (!data) return;
      if (data.gcAudio === "on" || data.gclAudio === "on") setAudio(true);
      if (data.gcAudio === "off" || data.gclAudio === "off") setAudio(false);
    });
    window.addEventListener("pointerdown", () => setAudio(true));

    function pop() {
      if (!audioOn) return;
      popSfx.muted = false;
      popSfx.volume = 0.45;
      popSfx.currentTime = 0;
      popSfx.play().catch(() => {});
    }

    function rotateMessage() {
      message.classList.add("swap");
      window.setTimeout(() => {
        messageIndex = (messageIndex + 1) % messages.length;
        message.textContent = messages[messageIndex];
        message.classList.remove("swap");
        pop();
      }, 220);
    }

    window.setInterval(rotateMessage, 850);
  </script>
</body>
</html>
