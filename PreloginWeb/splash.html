<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Poplur — Splash</title>
  <!-- Keep splash startup light. 3D assets load on demand on their own screens. -->
  <link rel="preload" as="audio" href="/Poplur2025-iOS/Poplur2025/pop.mp3">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #0a0709; }
    /* No text selection outside real text entry. A long-press anywhere in the
       native shell must not raise the blue selection highlight, the drag
       handles or the iOS callout/magnifier — that chrome instantly breaks the
       illusion that this is an app. Same base rule the post-login bundle uses
       (poplur-clay-map/src/index.css); `user-select` inherits, so one
       declaration on the root covers the whole screen. Text ENTRY is exempted
       below so a caret and the callout still work inside a field. */
    html, body {
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    input, textarea, select, [contenteditable]:not([contenteditable='false']) {
      -webkit-user-select: text;
      user-select: text;
      -webkit-touch-callout: default;
    }
    body { position: relative; display: grid; place-items: center; font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, sans-serif; }
    video {
      position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
      display: block; z-index: 1; opacity: 0; pointer-events: none;
      transition: opacity .12s linear;
    }
    video.ready { opacity: 1; }
    video::-webkit-media-controls,
    video::-webkit-media-controls-enclosure,
    video::-webkit-media-controls-panel,
    video::-webkit-media-controls-start-playback-button {
      display: none !important;
      -webkit-appearance: none !important;
      opacity: 0 !important;
    }
    .fallback { position: absolute; width: 45%; max-width: 170px; filter: drop-shadow(0 15px 18px rgba(255,45,145,.3)); z-index: 0; }
    .splash-scrim {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: radial-gradient(circle at 50% 56%, rgba(0,0,0,.55), rgba(0,0,0,.2) 52%, transparent 74%);
    }
    .loader-layer { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
    .loader {
      position: absolute;
      left: 50%;
      top: 68%;
      transform: translate(-50%, -50%);
      width: 58%;
      max-width: 215px;
      display: grid;
      gap: 16px;
      text-align: center;
    }
    .loading-text {
      min-height: 23px;
      margin: 0;
      color: #f43b99;
      font-size: 20px;
      line-height: 1.3;
      font-weight: 850;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      background: linear-gradient(100deg, #ff8ac5 0%, #f43b99 34%, #fff3fa 50%, #f43b99 66%, #c92e7d 100%);
      background-size: 220% 100%;
      background-position: 100% 0;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 12px rgba(244,59,153,.5));
      animation: shaderSweep 2.2s linear infinite;
      transition: opacity .22s ease;
    }
    .loading-text.swap { opacity: .18; }
    .track {
      position: relative;
      width: 100%;
      height: 9px;
      overflow: hidden;
      border: 1px solid rgba(244,59,153,.35);
      border-radius: 999px;
      background: rgba(28,8,18,.55);
      box-shadow: inset 0 2px 4px rgba(0,0,0,.5);
    }
    /* The bar is full width and slides in from the left behind .track's
       existing overflow:hidden, rather than growing its own `width`.
       `width` is a layout property, so it cannot be composited — every frame
       needed main-thread layout, and this bar is on screen precisely when the
       main thread is saturated launching the app. It therefore got no frames
       and sat frozen on its first keyframe at 4%, which is what a stuck
       progress bar looked like on device.
       translateX runs on the compositor and keeps moving while the main thread
       is blocked. Sliding rather than scaling on purpose: scaleX would squash
       the 45deg barber stripes as the bar filled. */
    .fill {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background-image: repeating-linear-gradient(45deg, #ffe1f1 0 15px, #ff86c4 15px 29px, #f53c99 29px 44px);
      background-size: 62px 62px;
      box-shadow: inset 0 2px 2px rgba(255,255,255,.6), inset 0 -2px 4px rgba(140,18,74,.5), 0 0 16px rgba(244,59,153,.32);
      transform: translateX(-96%);
      will-change: transform;
      animation: splashFill 4s ease-out infinite, barber .7s linear infinite;
    }
    @keyframes shaderSweep { to { background-position: -120% 0; } }
    @keyframes splashFill { 0% { transform: translateX(-96%); } 70% { transform: translateX(-10%); } 88%, 100% { transform: translateX(0); } }
    @keyframes barber { from { background-position: 0 0; } to { background-position: -62px 0; } }
    @media (prefers-reduced-motion: reduce) {
      .loading-text { animation: none; }
      .fill { animation: none; transform: translateX(-30%); }
    }
  </style>
</head>
<body>
  <img class="fallback" src="/Poplur2025-iOS/Poplur2025/Assets.xcassets/logo.imageset/logo1.png" alt="Poplur">
  <video class="splash-video" autoplay muted loop playsinline webkit-playsinline preload="auto"
    disablepictureinpicture disableremoteplayback controlslist="nodownload noplaybackrate nofullscreen noremoteplayback"
    aria-label="Poplur clay splash animation">
    <source src="/Poplur2025-iOS/Poplur2025/poplur_splash.mp4" type="video/mp4">
  </video>
  <audio id="popSfx" preload="auto" src="/Poplur2025-iOS/Poplur2025/pop.mp3"></audio>
  <!-- radio_bed.wav is gone, not silenced: `volume = 0` is ignored by iOS on a
       media element, so on a real iPhone this 11 kHz loop played at full volume
       and was the buzz under pre-login. See the matching note in welcome. -->

  <div class="splash-scrim"></div>
  <div class="loader-layer" aria-label="Splash loading progress">
    <div class="loader">
      <p class="loading-text" aria-live="polite">Warming up the pinetrees</p>
      <div class="track" role="progressbar" aria-label="Loading Poplur" aria-valuemin="0" aria-valuemax="100" aria-valuenow="90">
        <div class="fill"></div>
      </div>
    </div>
  </div>
  <script>
    const messages = [
      "Warming up the pinetrees",
      "Rolling out the clay roads",
      "Teaching the pin to drop",
      "Sprinkling pink stars",
      "Kneading the little mountains",
      "Waking up the tugboat",
      "Polishing the big P",
      "Fluffing the clouds"
    ];
    const video = document.querySelector("video");
    const message = document.querySelector(".loading-text");
    const popSfx = document.getElementById("popSfx");
    let messageIndex = 0;
    let audioOn = false;
    let splashFrameReady = false;

    // A media element can report canplay/playing before WebKit has composited
    // its first frame. Keep the clay logo fallback visible until that frame has
    // actually painted so the browser's gray play placeholder is never exposed.
    video.controls = false;
    video.disablePictureInPicture = true;
    video.disableRemotePlayback = true;
    function revealPaintedFrame() {
      if (splashFrameReady || video.readyState < HTMLMediaElement.HAVE_CURRENT_DATA) return;
      const reveal = () => {
        if (video.readyState < HTMLMediaElement.HAVE_CURRENT_DATA) return;
        splashFrameReady = true;
        video.classList.add("ready");
      };
      if (typeof video.requestVideoFrameCallback === "function") {
        video.requestVideoFrameCallback(() => requestAnimationFrame(reveal));
      } else {
        requestAnimationFrame(() => requestAnimationFrame(reveal));
      }
    }
    video.addEventListener("playing", revealPaintedFrame);
    video.addEventListener("loadeddata", () => {
      video.play().catch(() => {});
      if (!video.paused) revealPaintedFrame();
    });
    video.addEventListener("error", () => {
      splashFrameReady = false;
      video.classList.remove("ready");
    });
    video.play().then(revealPaintedFrame).catch(() => {});

    // Mark the splash as seen so the welcome renders settled instead of
    // replaying its intro choreography in front of the user.
    try { sessionStorage.setItem("poplurSplashShown", "1"); } catch {}

    // No bed, and so no position to hand to Welcome either — the whole
    // `poplurRadio.t` handoff existed to keep a loop nobody was meant to hear
    // from restarting between pages. The splash is silent apart from the pops.

    // Audio can only start after a user gesture; the GCL preview grants it by
    // posting gcAudio on hover, a real device by the first touch.
    function setAudio(on) {
      audioOn = on;
      if (!on) popSfx.pause();
    }
    // Never autoplay audio from a non-interactive launch cover. Even muted
    // video can coexist with an audible <audio> element that registers native
    // rewind/play/forward controls. The prototype may grant sound explicitly;
    // a real device waits for the person's first gesture on pre-login.
    window.addEventListener("message", event => {
      const data = event && event.data;
      if (!data) return;
      if (data.gcAudio === "on" || data.gclAudio === "on") setAudio(true);
      if (data.gcAudio === "off" || data.gclAudio === "off") setAudio(false);
    });
    window.addEventListener("pointerdown", () => setAudio(true));

    function pop() {
      if (!audioOn) return;
      popSfx.muted = false;
      popSfx.volume = 0.45;
      popSfx.currentTime = 0;
      popSfx.play().catch(() => {});
    }

    function rotateMessage() {
      message.classList.add("swap");
      window.setTimeout(() => {
        messageIndex = (messageIndex + 1) % messages.length;
        message.textContent = messages[messageIndex];
        message.classList.remove("swap");
        pop();
      }, 220);
    }

    window.setInterval(rotateMessage, 850);
  </script>
</body>
</html>
